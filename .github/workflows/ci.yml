name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: truth/package-lock.json

      - name: Install dependencies
        working-directory: truth
        run: npm ci

      - name: Lint
        working-directory: truth
        run: npm run lint

      - name: Type check
        working-directory: truth
        run: npx tsc --noEmit

      - name: Test
        working-directory: truth
        run: npm run test

      - name: Build
        working-directory: truth
        run: npm run build
